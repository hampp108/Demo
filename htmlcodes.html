<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic HTML Example</title>
</head>

<body>

    <!-- Header section -->
    <header>
        <h1>My Website</h1>
        <p>Welcome to my website</p>
    </header>

    <!-- Navigation section -->
    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <!-- Main content -->
    <main>

        <!-- Home section -->
        <section id="home">
            <h2>Home</h2>
            <p>This is the home section.</p>
        </section>

        <!-- About section -->
        <section id="about">
            <h2>About Us</h2>
            <p>This website is created using semantic HTML.</p>
        </section>

        <!-- Article section -->
        <article>
            <h2>Latest News</h2>
            <p>This is an independent article.</p>
        </article>

        <!-- Aside section -->
        <aside>
            <h3>Related Information</h3>
            <p>Some additional information.</p>
        </aside>

    </main>

    <!-- Footer section -->
    <footer>
        <p>&copy; 2026 My Website. All rights reserved.</p>
    </footer>

</body>
</html>
